[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "potential-blacktool"
version = "0.1.0"
description = "Scoped passive security assessment toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
blacktool = "blacktool.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
